services:
  backend:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./endforecast_sessions:/app/endforecast_sessions
      - ./endforecast:/app/endforecast
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped