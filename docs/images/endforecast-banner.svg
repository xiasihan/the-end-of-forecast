<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 160" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a202c"/>
      <stop offset="100%" stop-color="#2d3748"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4299e1"/>
      <stop offset="50%" stop-color="#667eea"/>
      <stop offset="100%" stop-color="#9f7aea"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="720" height="160" rx="12" fill="url(#bg)"/>

  <!-- Subtle grid pattern -->
  <line x1="0" y1="40" x2="720" y2="40" stroke="#4a5568" stroke-width="0.3" opacity="0.5"/>
  <line x1="0" y1="80" x2="720" y2="80" stroke="#4a5568" stroke-width="0.3" opacity="0.5"/>
  <line x1="0" y1="120" x2="720" y2="120" stroke="#4a5568" stroke-width="0.3" opacity="0.5"/>

  <!-- Left decorative bracket -->
  <rect x="30" y="45" width="4" height="70" rx="2" fill="url(#accent)"/>

  <!-- Main title -->
  <text x="50" y="78" font-size="38" font-weight="700" fill="#f7fafc">EndForecast</text>

  <!-- Subtitle -->
  <text x="52" y="108" font-size="14" fill="#a0aec0" letter-spacing="1">The End of Forecast · AI Agent-Driven Adaptive Prediction</text>

  <!-- Right accent line -->
  <line x1="560" y1="40" x2="560" y2="120" stroke="#667eea" stroke-width="0.5" opacity="0.6"/>

  <!-- Key capability tags -->
  <rect x="580" y="46" width="120" height="22" rx="11" fill="#4299e1" opacity="0.25"/>
  <text x="640" y="62" text-anchor="middle" font-size="10" fill="#63b3ed">LeakGuard</text>

  <rect x="580" y="74" width="120" height="22" rx="11" fill="#667eea" opacity="0.25"/>
  <text x="640" y="90" text-anchor="middle" font-size="10" fill="#a3bffa">LLM-Driven</text>

  <rect x="580" y="102" width="120" height="22" rx="11" fill="#9f7aea" opacity="0.25"/>
  <text x="640" y="118" text-anchor="middle" font-size="10" fill="#d6bcfa">Statistical Rigor</text>

  <!-- Bottom decorative bar -->
  <rect x="30" y="140" width="660" height="3" rx="1.5" fill="url(#accent)" opacity="0.4"/>
</svg>