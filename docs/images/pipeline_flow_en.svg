<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 1100" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#4a5568"/>
    </marker>
    <marker id="arrowLLM" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#d69e2e"/>
    </marker>
    <filter id="shadow" x="-3%" y="-3%" width="108%" height="112%">
      <feDropShadow dx="0.5" dy="1" stdDeviation="2" flood-color="#000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="820" height="1100" fill="#f7fafc" rx="6"/>

  <!-- Title -->
  <text x="410" y="32" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">EndForecast — 10-Phase Prediction Pipeline</text>
  <text x="410" y="50" text-anchor="middle" font-size="10" fill="#718096">All LLM decision points have deterministic fallbacks — zero-config mode works without any LLM</text>

  <!-- Phase 0 -->
  <rect x="250" y="62" width="320" height="42" rx="8" fill="#e2e8f0" stroke="#a0aec0" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="260" y="80" font-size="11" font-weight="700" fill="#4a5568">Phase 0</text>
  <text x="260" y="96" font-size="11" fill="#718096">Requirements Gathering (risk detection)</text>

  <line x1="410" y1="104" x2="410" y2="124" stroke="#4a5568" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Phase 1-2 row -->
  <rect x="140" y="128" width="260" height="42" rx="8" fill="#ebf8ff" stroke="#63b3ed" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="150" y="146" font-size="11" font-weight="700" fill="#2b6cb0">Phase 1</text>
  <text x="150" y="162" font-size="11" fill="#4a5568">Data Understanding · Fingerprint · Label Noise</text>

  <rect x="420" y="128" width="260" height="42" rx="8" fill="#ebf8ff" stroke="#63b3ed" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="430" y="146" font-size="11" font-weight="700" fill="#2b6cb0">Phase 2</text>
  <text x="430" y="162" font-size="11" fill="#4a5568">Data Preparation (imputation)</text>

  <line x1="270" y1="170" x2="270" y2="188" stroke="#63b3ed" stroke-width="1"/>
  <line x1="550" y1="170" x2="550" y2="188" stroke="#63b3ed" stroke-width="1"/>
  <line x1="270" y1="188" x2="550" y2="188" stroke="#63b3ed" stroke-width="1"/>
  <line x1="410" y1="188" x2="410" y2="210" stroke="#4a5568" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Phase 3 - LeakGuard -->
  <rect x="240" y="214" width="340" height="50" rx="10" fill="#fff5f5" stroke="#fc8181" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="250" y="234" font-size="11" font-weight="700" fill="#c53030">Phase 3 ⚠ LeakGuard</text>
  <text x="250" y="252" font-size="11" fill="#4a5568">Temporal boundaries · Feature crossing · Pass or block</text>

  <line x1="410" y1="264" x2="410" y2="286" stroke="#38a169" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- LLM Experiment Configurator (NEW) -->
  <rect x="160" y="290" width="500" height="52" rx="10" fill="#fffff0" stroke="#d69e2e" stroke-width="1.5" filter="url(#shadow)" stroke-dasharray="4,2"/>
  <text x="410" y="310" text-anchor="middle" font-size="12" font-weight="700" fill="#b7791f">🤖 LLM Experiment Configurator</text>
  <text x="410" y="328" text-anchor="middle" font-size="10" fill="#975a16">One LLM call decides ALL parameters: holdout · CV · route · trials · tuning · metric</text>
  <text x="410" y="340" text-anchor="middle" font-size="9" fill="#c05621">(Replaces ~8 hardcoded if/elif branches; falls back to rule-based defaults)</text>

  <line x1="410" y1="342" x2="410" y2="364" stroke="#d69e2e" stroke-width="1" marker-end="url(#arrowLLM)"/>

  <!-- Holdout Split -->
  <rect x="240" y="368" width="340" height="34" rx="8" fill="#f8f9fa" stroke="#cbd5e0" stroke-width="1"/>
  <text x="410" y="390" text-anchor="middle" font-size="11" fill="#4a5568">Holdout Split (10–20%) — chronological / stratified / random</text>

  <line x1="410" y1="402" x2="410" y2="420" stroke="#4a5568" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Phase 4 - Baselines -->
  <rect x="240" y="424" width="340" height="50" rx="10" fill="#f0fff4" stroke="#68d391" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="250" y="444" font-size="11" font-weight="700" fill="#276749">Phase 4 ◈ Baseline Establishment</text>
  <text x="250" y="462" font-size="11" fill="#4a5568">Naive · Seasonal · Linear · Heuristic-First Check</text>

  <line x1="410" y1="474" x2="410" y2="496" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Phase 5-6-7 loop box -->
  <rect x="110" y="500" width="600" height="256" rx="12" fill="#fffbeb" stroke="#f6ad55" stroke-width="1.5"/>
  <text x="410" y="522" text-anchor="middle" font-size="12" font-weight="700" fill="#d69e2e">Phases 5–7  Multi-Round Experiment Loop</text>

  <!-- Phase 5 -->
  <rect x="140" y="538" width="160" height="48" rx="8" fill="#fff" stroke="#f6ad55" stroke-width="1" filter="url(#shadow)"/>
  <text x="145" y="556" font-size="11" font-weight="700" fill="#dd6b20">Phase 5: Plan &amp; Execute</text>
  <text x="145" y="572" font-size="10" fill="#718096">LLM Planner + Feature Parser</text>
  <text x="145" y="584" font-size="9" fill="#a0aec0">lag_N · diff_N · rolling_N · ema_N</text>

  <!-- Phase 6 -->
  <rect x="500" y="538" width="160" height="48" rx="8" fill="#fff" stroke="#f6ad55" stroke-width="1" filter="url(#shadow)"/>
  <text x="505" y="556" font-size="11" font-weight="700" fill="#dd6b20">Phase 6: Evaluate</text>
  <text x="505" y="572" font-size="10" fill="#718096">Multi-metric · t-test · ECE</text>
  <text x="505" y="584" font-size="9" fill="#a0aec0">Direction-aware best selection</text>

  <!-- Phase 7 -->
  <rect x="320" y="604" width="160" height="48" rx="8" fill="#fff" stroke="#f6ad55" stroke-width="1" filter="url(#shadow)"/>
  <text x="325" y="622" font-size="11" font-weight="700" fill="#dd6b20">Phase 7: Refine &amp; Ensemble</text>
  <text x="325" y="638" font-size="10" fill="#718096">LLM Refiner · Residual correction</text>
  <text x="325" y="650" font-size="9" fill="#a0aec0">Ensemble: median / weighted / stacking</text>

  <!-- Arrows inside loop -->
  <line x1="300" y1="562" x2="498" y2="562" stroke="#f6ad55" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="500" y1="586" x2="400" y2="602" stroke="#f6ad55" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="320" y1="628" x2="202" y2="562" stroke="#f6ad55" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Loop metadata -->
  <text x="180" y="672" font-size="10" fill="#d69e2e">R1: Broad sweep (no HPO)</text>
  <text x="180" y="686" font-size="10" fill="#d69e2e">R2: HPO + direction-aware selection</text>
  <text x="180" y="700" font-size="10" fill="#d69e2e">R3: Ensemble + Refinement</text>

  <text x="420" y="672" font-size="10" fill="#d69e2e">→ LLM Diagnostician analyzes failures → adjust</text>
  <text x="410" y="714" text-anchor="middle" font-size="10" fill="#ed8936">Convergence check: improvement &lt; 1% → stop</text>

  <text x="410" y="740" text-anchor="middle" font-size="10" fill="#d69e2e">Optimization budget tracks degrees of freedom consumed</text>

  <line x1="410" y1="756" x2="410" y2="780" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Holdout Eval -->
  <rect x="240" y="784" width="340" height="34" rx="8" fill="#f8f9fa" stroke="#cbd5e0" stroke-width="1"/>
  <text x="410" y="806" text-anchor="middle" font-size="11" fill="#718096">Holdout Evaluation (single unbiased estimate, never seen in experiments)</text>

  <line x1="410" y1="818" x2="410" y2="840" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Phase 8-9 row -->
  <rect x="140" y="844" width="260" height="48" rx="8" fill="#faf5ff" stroke="#b794f4" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="150" y="864" font-size="11" font-weight="700" fill="#6b46c1">Phase 8</text>
  <text x="150" y="882" font-size="11" fill="#4a5568">Interpretation · SHAP · Permutation</text>

  <rect x="420" y="844" width="260" height="48" rx="8" fill="#faf5ff" stroke="#b794f4" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="430" y="864" font-size="11" font-weight="700" fill="#6b46c1">Phase 9</text>
  <text x="430" y="882" font-size="11" fill="#4a5568">Deploy · Model Card · Lineage (SHA256)</text>

  <line x1="270" y1="892" x2="270" y2="912" stroke="#b794f4" stroke-width="1"/>
  <line x1="550" y1="892" x2="550" y2="912" stroke="#b794f4" stroke-width="1"/>
  <line x1="270" y1="912" x2="550" y2="912" stroke="#b794f4" stroke-width="1"/>
  <line x1="410" y1="912" x2="410" y2="934" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Export -->
  <rect x="160" y="938" width="500" height="42" rx="8" fill="#edf2f7" stroke="#a0aec0" stroke-width="1" filter="url(#shadow)"/>
  <text x="180" y="958" font-size="10" fill="#4a5568">Export:</text>
  <rect x="240" y="948" width="120" height="24" rx="12" fill="#fff" stroke="#a0aec0" stroke-width="1"/>
  <text x="300" y="964" text-anchor="middle" font-size="10" fill="#4a5568">config.json</text>
  <rect x="372" y="948" width="120" height="24" rx="12" fill="#fff" stroke="#a0aec0" stroke-width="1"/>
  <text x="432" y="964" text-anchor="middle" font-size="10" fill="#4a5568">predictor.py</text>
  <rect x="504" y="948" width="120" height="24" rx="12" fill="#fff" stroke="#a0aec0" stroke-width="1"/>
  <text x="564" y="964" text-anchor="middle" font-size="10" fill="#4a5568">CLI tool</text>

  <line x1="410" y1="980" x2="410" y2="1004" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Phase 10 -->
  <rect x="240" y="1008" width="340" height="48" rx="10" fill="#e2e8f0" stroke="#a0aec0" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="250" y="1028" font-size="11" font-weight="700" fill="#4a5568">Phase 10 — Continuous Monitoring</text>
  <text x="250" y="1046" font-size="11" fill="#718096">Drift Detection · Skew Analysis · Freshness Scoring</text>

  <!-- Right legend -->
  <rect x="660" y="128" width="140" height="320" rx="8" fill="#fff" stroke="#e2e8f0" stroke-width="1" filter="url(#shadow)"/>
  <text x="730" y="150" text-anchor="middle" font-size="12" font-weight="700" fill="#2d3748">Key Features</text>
  <line x1="672" y1="158" x2="788" y2="158" stroke="#e2e8f0" stroke-width="0.8"/>
  <circle cx="678" cy="178" r="4" fill="#d69e2e"/>
  <text x="690" y="182" font-size="10" fill="#4a5568">LLM Configurator</text>
  <circle cx="678" cy="202" r="4" fill="#fc8181"/>
  <text x="690" y="206" font-size="10" fill="#4a5568">LeakGuard</text>
  <circle cx="678" cy="226" r="4" fill="#68d391"/>
  <text x="690" y="230" font-size="10" fill="#4a5568">Holdout eval</text>
  <circle cx="678" cy="250" r="4" fill="#f6ad55"/>
  <text x="690" y="254" font-size="10" fill="#4a5568">LLM-driven</text>
  <circle cx="678" cy="274" r="4" fill="#63b3ed"/>
  <text x="690" y="278" font-size="10" fill="#4a5568">Statistical rigor</text>
  <circle cx="678" cy="298" r="4" fill="#b794f4"/>
  <text x="690" y="302" font-size="10" fill="#4a5568">3-track deploy</text>
  <circle cx="678" cy="322" r="4" fill="#a0aec0"/>
  <text x="690" y="326" font-size="10" fill="#4a5568">Dir-aware metric</text>
  <circle cx="678" cy="346" r="4" fill="#ed8936"/>
  <text x="690" y="350" font-size="10" fill="#4a5568">Feature naming</text>
  <circle cx="678" cy="370" r="4" fill="#48bb78"/>
  <text x="690" y="374" font-size="10" fill="#4a5568">Ensemble exec</text>

  <!-- Bottom right: available features -->
  <rect x="660" y="460" width="140" height="140" rx="8" fill="#f7fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="730" y="480" text-anchor="middle" font-size="10" font-weight="700" fill="#4a5568">Feature Convention</text>
  <line x1="672" y1="488" x2="788" y2="488" stroke="#e2e8f0" stroke-width="0.8"/>
  <text x="672" y="504" font-size="9" fill="#718096">lag_N, diff_N</text>
  <text x="672" y="518" font-size="9" fill="#718096">diff_lag_N</text>
  <text x="672" y="532" font-size="9" fill="#718096">rolling_mean_N</text>
  <text x="672" y="546" font-size="9" fill="#718096">rolling_std_N</text>
  <text x="672" y="560" font-size="9" fill="#718096">ema_N, pct_N</text>
  <text x="672" y="574" font-size="9" fill="#718096">14 calendar attrs</text>
  <text x="672" y="588" font-size="9" fill="#718096">raw columns pass</text>
</svg>