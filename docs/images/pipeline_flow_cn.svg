<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 1020" font-family="'Microsoft YaHei','PingFang SC','Segoe UI',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#4a5568"/>
    </marker>
    <filter id="shadow" x="-3%" y="-3%" width="108%" height="112%">
      <feDropShadow dx="0.5" dy="1" stdDeviation="2" flood-color="#000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="820" height="1020" fill="#f7fafc" rx="6"/>

  <text x="410" y="36" text-anchor="middle" font-size="18" font-weight="700" fill="#1a202c">EndForecast — 10 阶段预测流水线</text>

  <!-- Phase 0 -->
  <rect x="250" y="58" width="320" height="48" rx="8" fill="#e2e8f0" stroke="#a0aec0" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="260" y="80" font-size="12" font-weight="700" fill="#4a5568">阶段 0</text>
  <text x="260" y="98" font-size="11" fill="#718096">需求收集</text>

  <line x1="410" y1="106" x2="410" y2="128" stroke="#4a5568" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Phase 1-2 row -->
  <line x1="200" y1="132" x2="620" y2="132" stroke="#cbd5e0" stroke-width="0.8" stroke-dasharray="3,3"/>
  <rect x="140" y="136" width="260" height="48" rx="8" fill="#ebf8ff" stroke="#63b3ed" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="150" y="158" font-size="12" font-weight="700" fill="#2b6cb0">阶段 1</text>
  <text x="150" y="176" font-size="11" fill="#4a5568">数据理解</text>

  <rect x="420" y="136" width="260" height="48" rx="8" fill="#ebf8ff" stroke="#63b3ed" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="430" y="158" font-size="12" font-weight="700" fill="#2b6cb0">阶段 2</text>
  <text x="430" y="176" font-size="11" fill="#4a5568">数据准备</text>

  <line x1="270" y1="184" x2="270" y2="206" stroke="#63b3ed" stroke-width="1"/>
  <line x1="550" y1="184" x2="550" y2="206" stroke="#63b3ed" stroke-width="1"/>
  <line x1="270" y1="206" x2="550" y2="206" stroke="#63b3ed" stroke-width="1"/>
  <line x1="410" y1="206" x2="410" y2="230" stroke="#4a5568" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Phase 3 - LeakGuard -->
  <rect x="240" y="234" width="340" height="56" rx="10" fill="#fff5f5" stroke="#fc8181" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="250" y="256" font-size="12" font-weight="700" fill="#c53030">阶段 3 ⚠ LeakGuard 泄漏检查</text>
  <text x="250" y="274" font-size="11" fill="#4a5568">强制执行时间边界 — 通过或拒绝</text>

  <line x1="410" y1="290" x2="410" y2="314" stroke="#38a169" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Phase 4 -->
  <rect x="240" y="318" width="340" height="56" rx="10" fill="#f0fff4" stroke="#68d391" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="250" y="340" font-size="12" font-weight="700" fill="#276749">阶段 4 ◈ 基线建立</text>
  <text x="250" y="358" font-size="11" fill="#4a5568">朴素预测 · 季节性朴素 · 线性 · 启发式检查</text>

  <line x1="410" y1="374" x2="410" y2="400" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Phase 5-6-7 loop -->
  <rect x="110" y="404" width="600" height="260" rx="12" fill="#fffbeb" stroke="#f6ad55" stroke-width="1.5"/>
  <text x="410" y="428" text-anchor="middle" font-size="13" font-weight="700" fill="#d69e2e">阶段 5–7  多轮实验循环</text>

  <rect x="140" y="444" width="160" height="44" rx="8" fill="#fff" stroke="#f6ad55" stroke-width="1" filter="url(#shadow)"/>
  <text x="145" y="464" font-size="11" font-weight="700" fill="#dd6b20">阶段 5：实验执行</text>
  <text x="145" y="480" font-size="10" fill="#718096">Planner（LLM 驱动）</text>

  <rect x="500" y="444" width="160" height="44" rx="8" fill="#fff" stroke="#f6ad55" stroke-width="1" filter="url(#shadow)"/>
  <text x="505" y="464" font-size="11" font-weight="700" fill="#dd6b20">阶段 6：严谨评估</text>
  <text x="505" y="480" font-size="10" fill="#718096">多指标 · t检验 · 校准</text>

  <rect x="320" y="504" width="160" height="44" rx="8" fill="#fff" stroke="#f6ad55" stroke-width="1" filter="url(#shadow)"/>
  <text x="325" y="524" font-size="11" font-weight="700" fill="#dd6b20">阶段 7：精修</text>
  <text x="325" y="540" font-size="10" fill="#718096">诊断 · 集成</text>

  <line x1="300" y1="466" x2="498" y2="466" stroke="#f6ad55" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="500" y1="488" x2="400" y2="502" stroke="#f6ad55" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="320" y1="526" x2="202" y2="466" stroke="#f6ad55" stroke-width="1.2" marker-end="url(#arrow)"/>

  <text x="180" y="580" font-size="10" fill="#d69e2e">第1轮：广撒网</text>
  <text x="180" y="594" font-size="10" fill="#d69e2e">第2轮：HPO + 精修</text>
  <text x="180" y="608" font-size="10" fill="#d69e2e">第3轮：集成</text>
  
  <text x="420" y="576" font-size="10" fill="#d69e2e">→ 调整策略 → 重新实验</text>

  <text x="410" y="620" text-anchor="middle" font-size="10" fill="#ed8936">持续迭代直到收敛或优化预算耗尽</text>
  <text x="410" y="646" text-anchor="middle" font-size="10" fill="#d69e2e">优化自由度追踪防止数据窥探</text>

  <line x1="410" y1="664" x2="410" y2="692" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Phase 8-9 -->
  <rect x="140" y="696" width="260" height="48" rx="8" fill="#faf5ff" stroke="#b794f4" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="150" y="718" font-size="12" font-weight="700" fill="#6b46c1">阶段 8</text>
  <text x="150" y="736" font-size="11" fill="#4a5568">可解释性 · SHAP</text>

  <rect x="420" y="696" width="260" height="48" rx="8" fill="#faf5ff" stroke="#b794f4" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="430" y="718" font-size="12" font-weight="700" fill="#6b46c1">阶段 9</text>
  <text x="430" y="736" font-size="11" fill="#4a5568">部署 · Model Card · 溯源</text>

  <line x1="270" y1="744" x2="270" y2="766" stroke="#b794f4" stroke-width="1"/>
  <line x1="550" y1="744" x2="550" y2="766" stroke="#b794f4" stroke-width="1"/>
  <line x1="270" y1="766" x2="550" y2="766" stroke="#b794f4" stroke-width="1"/>
  <line x1="410" y1="766" x2="410" y2="790" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Export tracks -->
  <rect x="160" y="794" width="500" height="48" rx="8" fill="#edf2f7" stroke="#a0aec0" stroke-width="1" filter="url(#shadow)"/>
  <text x="180" y="816" font-size="10" fill="#4a5568">导出方式：</text>
  <rect x="240" y="804" width="120" height="28" rx="14" fill="#fff" stroke="#a0aec0" stroke-width="1"/>
  <text x="300" y="823" text-anchor="middle" font-size="10" fill="#4a5568">config.json</text>
  <rect x="372" y="804" width="120" height="28" rx="14" fill="#fff" stroke="#a0aec0" stroke-width="1"/>
  <text x="432" y="823" text-anchor="middle" font-size="10" fill="#4a5568">predictor.py</text>
  <rect x="504" y="804" width="120" height="28" rx="14" fill="#fff" stroke="#a0aec0" stroke-width="1"/>
  <text x="564" y="823" text-anchor="middle" font-size="10" fill="#4a5568">CLI 工具</text>

  <line x1="410" y1="842" x2="410" y2="868" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Phase 10 -->
  <rect x="240" y="872" width="340" height="56" rx="10" fill="#e2e8f0" stroke="#a0aec0" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="250" y="894" font-size="12" font-weight="700" fill="#4a5568">阶段 10 — 持续监控</text>
  <text x="250" y="912" font-size="11" fill="#718096">漂移检测 · 偏差分析 · 新鲜度评分</text>

  <!-- Right side legend -->
  <rect x="660" y="136" width="140" height="280" rx="8" fill="#fff" stroke="#e2e8f0" stroke-width="1" filter="url(#shadow)"/>
  <text x="730" y="158" text-anchor="middle" font-size="12" font-weight="700" fill="#2d3748">核心特色</text>
  <line x1="672" y1="166" x2="788" y2="166" stroke="#e2e8f0" stroke-width="0.8"/>
  <circle cx="678" cy="186" r="4" fill="#fc8181"/>
  <text x="690" y="190" font-size="10" fill="#4a5568">LeakGuard 泄漏防护</text>
  <circle cx="678" cy="210" r="4" fill="#68d391"/>
  <text x="690" y="214" font-size="10" fill="#4a5568">启发式优先</text>
  <circle cx="678" cy="234" r="4" fill="#f6ad55"/>
  <text x="690" y="238" font-size="10" fill="#4a5568">LLM 驱动决策</text>
  <circle cx="678" cy="258" r="4" fill="#63b3ed"/>
  <text x="690" y="262" font-size="10" fill="#4a5568">统计严谨性</text>
  <circle cx="678" cy="282" r="4" fill="#b794f4"/>
  <text x="690" y="286" font-size="10" fill="#4a5568">三轨部署</text>
  <circle cx="678" cy="306" r="4" fill="#a0aec0"/>
  <text x="690" y="310" font-size="10" fill="#4a5568">持续监控</text>

</svg>